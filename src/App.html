<script>
/* ================= EDEN CRM — الواجهة ================= */
let ME = null, PEOPLE = [], PROJECTS = [], LEADS = [], C = null, ADMIN = null;
const F = { q: '', owner: 'all', source: '', project: '' };
let tab = store('tab') || 'pipeline', period = 'all', TODAY = '';
let D = null, settingsDirty = false, selected = new Set();

/* ---------- utils ---------- */
function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e); })[fn].apply(null, args);
  });
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem('crm.' + k); localStorage.setItem('crm.' + k, v); } catch (e) { return null; } }
function h(t, a) {
  const e = document.createElement(t);
  if (a) for (const x in a) {
    const v = a[x];
    if (v == null || v === false) continue;
    if (x.indexOf('on') === 0 && typeof v === 'function') e.addEventListener(x.slice(2), v);
    else if (x === 'class') e.className = v;
    else if (x === 'style') e.style.cssText = v;
    else if (['value', 'checked', 'disabled', 'selected', 'hidden', 'draggable', 'tabIndex'].indexOf(x) >= 0) e[x] = v;
    else e.setAttribute(x, v === true ? '' : v);
  }
  const kids = Array.prototype.slice.call(arguments, 2).flat(9);
  kids.forEach(function (c) { if (c == null || c === false || c === '') return; e.append(c.nodeType ? c : String(c)); });
  return e;
}
const $ = function (id) { return document.getElementById(id); };
const nf = new Intl.NumberFormat('en-US');
const df = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'short' });
const dtf = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
function addDays(s, n) { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dayDiff(s) { return Math.round((Date.parse(s + 'T12:00:00Z') - Date.parse(TODAY + 'T12:00:00Z')) / 864e5); }
function localToday() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
const digits = function (p) { return String(p || '').replace(/\D/g, ''); };
function waNum(p) { let d = digits(p); if (d.indexOf('00') === 0) d = d.slice(2); else if (/^01\d{9}$/.test(d)) d = '2' + d; else if (/^5\d{8}$/.test(d)) d = '995' + d; return d; }
const isMgr = function () { return ME && (ME.role === 'admin' || ME.role === 'manager'); };
const isAdmin = function () { return ME && ME.role === 'admin'; };
const OPEN = function (s) { return ['won', 'lost'].indexOf(s || 'new') < 0; };
let SL = {}, SRC = {};
function nm(email) {
  if (!email) return 'بدون مسؤول';
  if (email === 'system') return 'النظام';
  const p = PEOPLE.find(function (x) { return x.email === email; });
  const n = p ? p.name : email.split('@')[0];
  return email === ME.email ? n + ' (أنا)' : n;
}
function initials(email) { const n = nm(email).replace(' (أنا)', '').trim(); return (n[0] || '?').toUpperCase(); }
function av(email, cls) { return h('span', { class: 'av' + (cls ? ' ' + cls : ''), style: 'display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft)' }, email ? initials(email) : '–'); }
function toast(msg, kind) { const r = $('toast-root'); r.replaceChildren(h('div', { class: 'toast' + (kind ? ' ' + kind : ''), role: 'status' }, msg)); clearTimeout(toast.t); toast.t = setTimeout(function () { r.replaceChildren(); }, 3500); }
function errText(e) { return (e && e.message) ? e.message.replace(/^Exception:\s*/, '') : 'حصلت مشكلة، جرب تاني.'; }
function fuInfo(l) {
  if (!OPEN(l.stage)) return null;
  if (!l.nextFollowUp) return { cls: 'none', text: 'مفيش متابعة' };
  const d = dayDiff(l.nextFollowUp);
  if (d < 0) return { cls: 'late', text: 'متأخر ' + (-d) + ' يوم', d: d };
  if (d === 0) return { cls: 'today', text: 'النهارده', d: d };
  if (d === 1) return { cls: 'soon', text: 'بكرة', d: d };
  return { cls: 'soon', text: df.format(new Date(l.nextFollowUp + 'T12:00:00')), d: d };
}
function srcChip(s) { return s ? h('span', { class: 'chip' }, SRC[s] || s) : null; }
function ownerBadge(e) { return h('span', { class: 'owner' }, av(e, 'sm'), h('span', {}, nm(e))); }
function upsertLead(l) { const i = LEADS.findIndex(function (x) { return x.id === l.id; }); if (i >= 0) LEADS[i] = l; else LEADS.unshift(l); }

/* ---------- filter ---------- */
function visible() {
  const q = F.q.trim().toLowerCase(), qd = digits(q);
  return LEADS.filter(function (l) {
    if (F.owner === 'me' && l.ownerEmail !== ME.email) return false;
    if (F.owner === 'none' && l.ownerEmail) return false;
    if (['all', 'me', 'none'].indexOf(F.owner) < 0 && l.ownerEmail !== F.owner) return false;
    if (F.source && l.source !== F.source) return false;
    if (F.project && l.project !== F.project) return false;
    if (q) {
      const hit = (l.name || '').toLowerCase().indexOf(q) >= 0 || (qd.length >= 3 && digits(l.phone).indexOf(qd) >= 0) ||
        (l.unit || '').toLowerCase().indexOf(q) >= 0 || (l.email || '').toLowerCase().indexOf(q) >= 0;
      if (!hit) return false;
    }
    return true;
  });
}

/* ---------- render ---------- */
let rq = 0;
function render() { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; doRender(); }); }
function tabsList() {
  const t = [['pipeline', 'Pipeline'], ['list', 'كل الليدز'], ['follow', 'المتابعات'], ['reports', 'التقارير']];
  if (isMgr()) t.push(['settings', 'الإعدادات']);
  return t;
}
function doRender() {
  if (!ME) return;
  if (!tabsList().some(function (t) { return t[0] === tab; })) tab = 'pipeline';
  const late = LEADS.filter(function (l) { return (isMgr() ? true : l.ownerEmail === ME.email) && fuInfo(l) && fuInfo(l).cls === 'late'; }).length;
  $('tabs').replaceChildren.apply($('tabs'), tabsList().map(function (t) {
    return h('button', { class: 'tab', role: 'tab', 'aria-selected': String(tab === t[0]), onclick: function () { tab = t[0]; store('tab', tab); settingsDirty = false; selected.clear(); render(); } },
      t[1], t[0] === 'follow' && late ? h('span', { class: 'tab-n' }, late) : null);
  }));
  $('me').replaceChildren(av(ME.email), h('span', {}, { admin: 'أدمن', manager: 'مدير', sales: 'سيلز' }[ME.role]));
  $('bar').hidden = tab === 'settings';
  $('f-owner').hidden = !isMgr();
  renderFilters();
  const v = $('view');
  if (tab === 'settings') { if (!settingsDirty) v.replaceChildren(viewSettings()); }
  else if (!LEADS.length) v.replaceChildren(welcome());
  else {
    const list = visible();
    v.replaceChildren(tab === 'pipeline' ? viewPipeline(list) : tab === 'list' ? viewList(list) : tab === 'follow' ? viewFollow(list) : viewReports(list));
  }
}
function fillSelect(sel, opts, val) {
  sel.replaceChildren.apply(sel, opts.map(function (o) { return h('option', { value: o[0] }, o[1]); }));
  sel.value = opts.some(function (o) { return o[0] === val; }) ? val : opts[0][0];
  return sel.value;
}
function renderFilters() {
  if (isMgr()) {
    const owners = [['all', 'كل الفريق'], ['me', 'ليدزي أنا'], ['none', 'بدون مسؤول']];
    PEOPLE.filter(function (p) { return p.email !== ME.email; }).forEach(function (p) { owners.push([p.email, p.name]); });
    F.owner = fillSelect($('f-owner'), owners, F.owner);
  } else F.owner = 'all';
  F.source = fillSelect($('f-source'), [['', 'كل المصادر']].concat(C.sources), F.source);
  const projs = PROJECTS.map(function (p) { return p.name; });
  LEADS.forEach(function (l) { if (l.project && projs.indexOf(l.project) < 0) projs.push(l.project); });
  F.project = fillSelect($('f-project'), [['', 'كل المشاريع']].concat(projs.map(function (p) { return [p, p]; })), F.project);
}
function welcome() {
  return h('div', { class: 'welcome' },
    h('h2', {}, 'مفيش ليدز لسه'),
    h('p', {}, isMgr()
      ? 'الليدز هتظهر هنا أول ما تضيفها أو توصل من Meta وفورم الموقع. قبلها ضيف المشاريع وفريق السيلز من الإعدادات.'
      : 'لسه مفيش ليدز متسندة لك. أول ما ليد يتسند لك هيوصلك إيميل ويظهر هنا.'),
    h('div', { class: 'acts', style: 'justify-content:flex-start' },
      h('button', { class: 'btn primary', onclick: function () { openLead('new'); } }, 'ليد جديد'),
      isMgr() ? h('button', { class: 'btn', onclick: function () { tab = 'settings'; store('tab', tab); render(); } }, 'الإعدادات') : null));
}

/* pipeline */
function viewPipeline(list) {
  return h('div', { class: 'board' }, C.stages.map(function (s) {
    const k = s[0];
    const items = list.filter(function (l) { return (l.stage || 'new') === k; })
      .sort(function (a, b) { return (a.nextFollowUp || '9') < (b.nextFollowUp || '9') ? -1 : 1; });
    const col = h('section', {
      class: 'col', 'aria-label': s[1],
      ondragover: function (e) { e.preventDefault(); col.classList.add('over'); },
      ondragleave: function () { col.classList.remove('over'); },
      ondrop: function (e) {
        e.preventDefault(); col.classList.remove('over');
        const l = LEADS.find(function (x) { return x.id === e.dataTransfer.getData('text/plain'); });
        if (!l || (l.stage || 'new') === k) return;
        if (k === 'won' || k === 'lost') openLead(l.id, k); else changeStage(l.id, k);
      }
    },
      h('header', { class: 'col-h' }, h('span', { class: 'dot st-' + k }), h('span', {}, s[1]), h('span', { class: 'count' }, items.length)),
      items.length ? items.slice(0, 200).map(card) : h('p', { class: 'col-empty' }, 'مفيش'));
    return col;
  }));
}
function card(l) {
  const fu = fuInfo(l);
  return h('div', {
    class: 'card', role: 'button', tabIndex: 0, draggable: true,
    ondragstart: function (e) { e.dataTransfer.setData('text/plain', l.id); },
    onclick: function () { openLead(l.id); }, onkeydown: function (e) { if (e.key === 'Enter') openLead(l.id); }
  },
    h('div', { class: 'card-top' }, h('strong', {}, l.name || l.phone || 'بدون اسم'), srcChip(l.source)),
    (l.project || l.unit) ? h('div', { class: 'meta' }, [l.project, l.unit].filter(Boolean).join(' · ')) : null,
    l.stage === 'won' && l.dealValue ? h('div', { class: 'meta num' }, nf.format(l.dealValue) + ' ' + (l.currency || '')) : null,
    l.stage === 'lost' && l.lostReason ? h('div', { class: 'meta' }, 'السبب: ' + l.lostReason) : null,
    h('div', { class: 'card-bot' }, isMgr() ? ownerBadge(l.ownerEmail) : h('span', { class: 'meta' }, l.campaign || ''), fu ? h('span', { class: 'fu ' + fu.cls }, fu.text) : null));
}

/* list + bulk assign */
function viewList(list) {
  if (!list.length) return h('div', { class: 'empty' }, 'مفيش ليدز بالفلتر ده.');
  const mgr = isMgr();
  const bulk = mgr && selected.size ? (function () {
    const sel = h('select', { id: 'bulk-owner' }, h('option', { value: 'auto' }, 'توزيع تلقائي'),
      PEOPLE.map(function (p) { return h('option', { value: p.email }, p.name); }), h('option', { value: '' }, 'بدون مسؤول'));
    const btn = h('button', { class: 'btn primary' }, 'وزّع');
    btn.addEventListener('click', async function () {
      btn.disabled = true;
      try { const r = await api('api_bulkAssign', Array.from(selected), sel.value); LEADS = r.leads; selected.clear(); toast('اتوزعوا'); render(); }
      catch (e) { toast(errText(e), 'err'); btn.disabled = false; }
    });
    return h('div', { class: 'bulk' }, h('span', {}, 'اخترت ' + selected.size + ' ليد'), sel, btn, h('button', { class: 'btn ghost', onclick: function () { selected.clear(); render(); } }, 'إلغاء'));
  })() : null;
  const allChk = mgr ? h('input', { type: 'checkbox', class: 'check', 'aria-label': 'اختار الكل', checked: list.length && list.every(function (l) { return selected.has(l.id); }),
    onchange: function (e) { list.forEach(function (l) { e.target.checked ? selected.add(l.id) : selected.delete(l.id); }); render(); } }) : null;
  return h('div', {},
    h('p', { class: 'meta', style: 'margin:0 0 8px' }, nf.format(list.length) + ' ليد'),
    bulk,
    h('div', { class: 'tbl-wrap' }, h('table', {},
      h('thead', {}, h('tr', {}, mgr ? h('th', {}, allChk) : null, ['الاسم', 'الموبايل', 'المصدر', 'المشروع / الوحدة', 'المرحلة', mgr ? 'المسؤول' : null, 'المتابعة', 'اتضاف'].filter(Boolean).map(function (t) { return h('th', {}, t); }))),
      h('tbody', {}, list.slice(0, 1000).map(function (l) {
        const fu = fuInfo(l);
        return h('tr', { onclick: function (e) { if (e.target.type !== 'checkbox') openLead(l.id); } },
          mgr ? h('td', {}, h('input', { type: 'checkbox', class: 'check', checked: selected.has(l.id), 'aria-label': 'اختار', onchange: function (e) { e.target.checked ? selected.add(l.id) : selected.delete(l.id); render(); } })) : null,
          h('td', {}, h('strong', { style: 'font-weight:600' }, l.name || '—')),
          h('td', {}, h('span', { class: 'ltr num' }, l.phone || '—')),
          h('td', {}, srcChip(l.source)),
          h('td', {}, [l.project, l.unit].filter(Boolean).join(' · ') || '—'),
          h('td', {}, h('span', { class: 'stage-pill' }, h('span', { class: 'dot st-' + (l.stage || 'new') }), SL[l.stage || 'new'])),
          mgr ? h('td', {}, ownerBadge(l.ownerEmail)) : null,
          h('td', {}, fu ? h('span', { class: 'fu ' + fu.cls }, fu.text) : '—'),
          h('td', { class: 'meta' }, l.createdAt ? df.format(new Date(l.createdAt)) : '—'));
      })))));
}

/* follow-ups */
function viewFollow(list) {
  const open = list.filter(function (l) { return OPEN(l.stage); });
  const by = function (a, b) { return a.nextFollowUp < b.nextFollowUp ? -1 : 1; };
  const fresh = open.filter(function (l) { return (l.stage || 'new') === 'new' && !l.firstContactAt; });
  const late = open.filter(function (l) { return l.nextFollowUp && dayDiff(l.nextFollowUp) < 0; }).sort(by);
  const tod = open.filter(function (l) { return l.nextFollowUp && dayDiff(l.nextFollowUp) === 0; });
  const week = open.filter(function (l) { const d = l.nextFollowUp && dayDiff(l.nextFollowUp); return d > 0 && d <= 7; }).sort(by);
  const none = open.filter(function (l) { return !l.nextFollowUp; });
  const g = function (title, arr, empty) {
    return h('section', { class: 'group' }, h('h2', {}, title, h('span', { class: 'count' }, arr.length)),
      arr.length ? h('div', { class: 'rows' }, arr.map(card)) : h('div', { class: 'empty' }, empty));
  };
  return h('div', { class: 'groups' },
    g('ليدز جديدة محدش كلمها', fresh, 'كل الليدز الجديدة اتكلموا.'),
    g('متأخرة', late, 'مفيش متابعات متأخرة.'),
    g('النهارده', tod, 'مفيش متابعات النهارده.'),
    g('الأسبوع الجاي', week, 'مفيش متابعات متسجلة للأسبوع الجاي.'),
    g('مفتوحة من غير ميعاد متابعة', none, 'كل الليدز المفتوحة ليها ميعاد متابعة.'));
}

/* reports */
function viewReports(all) {
  let list = all;
  if (period === '30') list = all.filter(function (l) { return l.createdAt && l.createdAt.slice(0, 10) >= addDays(TODAY, -30); });
  if (period === 'month') list = all.filter(function (l) { return l.createdAt && l.createdAt.slice(0, 7) === TODAY.slice(0, 7); });
  const won = list.filter(function (l) { return l.stage === 'won'; }), open = list.filter(function (l) { return OPEN(l.stage); });
  const late = open.filter(function (l) { const f = fuInfo(l); return f && f.cls === 'late'; }).length;
  const conv = list.length ? Math.round(won.length / list.length * 1000) / 10 : 0;
  const sums = {};
  won.forEach(function (l) { if (Number(l.dealValue)) { const c = l.currency || 'EGP'; sums[c] = (sums[c] || 0) + Number(l.dealValue); } });
  // متوسط وقت أول رد بالساعات
  const resp = list.filter(function (l) { return l.firstContactAt && l.assignedAt; })
    .map(function (l) { return (Date.parse(l.firstContactAt) - Date.parse(l.assignedAt)) / 36e5; }).filter(function (x) { return x >= 0; });
  const avgResp = resp.length ? resp.reduce(function (a, b) { return a + b; }, 0) / resp.length : null;
  const sel = h('select', { id: 'r-period', 'aria-label': 'الفترة', onchange: function (e) { period = e.target.value; render(); } },
    [['all', 'كل الوقت'], ['month', 'الشهر ده'], ['30', 'آخر 30 يوم']].map(function (o) { return h('option', { value: o[0], selected: period === o[0] }, o[1]); }));
  const kpi = function (l, v, s, cls) { return h('div', { class: 'kpi' + (cls ? ' ' + cls : '') }, h('span', {}, l), h('b', {}, v), s ? h('small', {}, s) : null); };
  const count = function (k) { return list.filter(function (l) { return (l.stage || 'new') === k; }).length; };
  const max = Math.max.apply(null, [1].concat(C.stages.map(function (s) { return count(s[0]); })));
  const funnel = h('div', { class: 'panel' }, h('h3', {}, 'الليدز حسب المرحلة'), C.stages.map(function (s) {
    const n = count(s[0]);
    return h('div', { class: 'hb' }, h('span', {}, s[1]), h('div', { class: 'track' }, h('div', { class: 'fill', style: 'width:' + (n / max * 100) + '%;background:var(--st-' + s[0] + ')' })), h('span', { class: 'n' }, n));
  }));
  const bySrc = C.sources.map(function (s) {
    return { l: s[1], n: list.filter(function (x) { return x.source === s[0]; }).length, w: list.filter(function (x) { return x.source === s[0] && x.stage === 'won'; }).length };
  }).filter(function (x) { return x.n; }).sort(function (a, b) { return b.n - a.n; });
  const smax = Math.max.apply(null, [1].concat(bySrc.map(function (x) { return x.n; })));
  const src = h('div', { class: 'panel' }, h('h3', {}, 'المصادر'),
    bySrc.length ? bySrc.map(function (x) {
      return h('div', { class: 'hb' }, h('span', {}, x.l), h('div', { class: 'track' }, h('div', { class: 'fill', style: 'width:' + (x.n / smax * 100) + '%;opacity:.35' }), h('div', { class: 'fill won', style: 'width:' + (x.w / smax * 100) + '%' })), h('span', { class: 'n' }, x.w + '/' + x.n));
    }) : h('p', { class: 'meta' }, 'مفيش بيانات.'),
    h('div', { class: 'legend' }, h('span', {}, h('i', { style: 'background:var(--accent);opacity:.35' }), 'كل الليدز'), h('span', {}, h('i', { style: 'background:var(--ok)' }), 'اتباعت')));
  const byProj = {};
  list.forEach(function (l) { const p = l.project || 'من غير مشروع'; byProj[p] = byProj[p] || { n: 0, w: 0 }; byProj[p].n++; if (l.stage === 'won') byProj[p].w++; });
  const proj = h('div', { class: 'panel' }, h('h3', {}, 'المشاريع'), h('table', {},
    h('thead', {}, h('tr', {}, ['المشروع', 'ليدز', 'اتباعت', 'تحويل'].map(function (t) { return h('th', {}, t); }))),
    h('tbody', {}, Object.keys(byProj).sort(function (a, b) { return byProj[b].n - byProj[a].n; }).map(function (p) {
      const x = byProj[p];
      return h('tr', {}, h('td', {}, p), h('td', { class: 'n' }, x.n), h('td', { class: 'n' }, x.w), h('td', { class: 'n' }, Math.round(x.w / x.n * 100) + '%'));
    }))));
  const lostR = {};
  list.filter(function (l) { return l.stage === 'lost'; }).forEach(function (l) { const r = l.lostReason || 'من غير سبب'; lostR[r] = (lostR[r] || 0) + 1; });
  const lmax = Math.max.apply(null, [1].concat(Object.values(lostR)));
  const lost = h('div', { class: 'panel' }, h('h3', {}, 'أسباب الخسارة'),
    Object.keys(lostR).length ? Object.keys(lostR).sort(function (a, b) { return lostR[b] - lostR[a]; }).map(function (r) {
      return h('div', { class: 'hb' }, h('span', {}, r), h('div', { class: 'track' }, h('div', { class: 'fill', style: 'width:' + (lostR[r] / lmax * 100) + '%;background:var(--danger)' })), h('span', { class: 'n' }, lostR[r]));
    }) : h('p', { class: 'meta' }, 'مفيش ليدز خسرانة في الفترة دي.'));
  let team = null;
  if (isMgr()) {
    const ids = []; list.forEach(function (l) { const k = l.ownerEmail || ''; if (ids.indexOf(k) < 0) ids.push(k); });
    const rows = ids.map(function (id) {
      const m = list.filter(function (l) { return (l.ownerEmail || '') === id; });
      const w = m.filter(function (l) { return l.stage === 'won'; }).length;
      const rs = m.filter(function (l) { return l.firstContactAt && l.assignedAt; }).map(function (l) { return (Date.parse(l.firstContactAt) - Date.parse(l.assignedAt)) / 36e5; }).filter(function (x) { return x >= 0; });
      return { id: id, n: m.length, o: m.filter(function (l) { return OPEN(l.stage); }).length, w: w, c: m.length ? Math.round(w / m.length * 100) : 0,
        late: m.filter(function (l) { const f = fuInfo(l); return f && f.cls === 'late'; }).length,
        resp: rs.length ? rs.reduce(function (a, b) { return a + b; }, 0) / rs.length : null };

      h('button', { class: 'btn primary', onclick: function () { D.pendingStage = null; changeStage(l.id, 'won', { dealValue: v.value, currency: c.value, unit: u.value.trim() }); } }, 'تأكيد البيع'),
      h('button', { class: 'btn ghost', onclick: function () { D.pendingStage = null; refreshDrawer(); } }, 'إلغاء'));
  }
  if (D.pendingStage === 'lost') {
    const s = h('select', { id: 'lost-r' }, C.lostReasons.map(function (x) { return h('option', { value: x }, x); }));
    sub = h('div', { class: 'subform' }, h('span', {}, 'سبب الخسارة'), s,
      h('button', { class: 'btn primary', onclick: function () { D.pendingStage = null; changeStage(l.id, 'lost', { lostReason: s.value }); } }, 'تأكيد'),
      h('button', { class: 'btn ghost', onclick: function () { D.pendingStage = null; refreshDrawer(); } }, 'إلغاء'));
  }
  D.live.replaceChildren.apply(D.live, [contact, stages, sub].filter(Boolean));
  if (D.acts) {
    const A = C.actLabel;
    D.logHost.replaceChildren(h('span', { class: 'lbl' }, 'سجل النشاط'), D.acts.length ? h('div', { class: 'log' }, D.acts.slice().reverse().map(function (a) {
      let what = a.text || '';
      if (a.type === 'stage') what = (SL[a.fromVal] || '') + ' ← ' + (SL[a.toVal] || '') + (a.text ? '\n' + a.text : '');
      if (a.type === 'assign') what = (a.toVal ? 'لـ ' + nm(a.toVal) : 'اتشال المسؤول') + (a.text ? '\n' + a.text : '');
      return h('div', { class: 'ev' + (a.type === 'stage' ? ' stage' : '') },
        h('div', { class: 'who' }, (a.by === 'system' ? 'النظام' : nm(a.by)) + ' · ' + (a.at ? dtf.format(new Date(a.at)) : '')),
        h('div', { class: 'what' }, h('span', { class: 'tag' }, A[a.type] || a.type), what));
    })) : h('p', { class: 'meta' }, 'لسه مفيش نشاط.'));
  }
}
function field(label, id, el, full) { return h('div', { class: 'field' + (full ? ' full' : '') }, h('label', { for: id }, label), el); }
function leadForm(l) {
  const isNew = !l;
  const x = l || { source: 'manual', nextFollowUp: TODAY };
  const name = h('input', { type: 'text', id: 'f-name', value: x.name || '' });
  const phone = h('input', { type: 'tel', id: 'f-phone', value: x.phone || '', dir: 'ltr' });
  const email = h('input', { type: 'email', id: 'f-email', value: x.email || '', dir: 'ltr' });
  const source = h('select', { id: 'f-src' }, C.sources.map(function (s) { return h('option', { value: s[0], selected: x.source === s[0] }, s[1]); }));
  const pnames = PROJECTS.map(function (p) { return p.name; }); if (x.project && pnames.indexOf(x.project) < 0) pnames.push(x.project);
  const project = h('select', { id: 'f-proj' }, h('option', { value: '' }, '—'), pnames.map(function (p) { return h('option', { value: p, selected: x.project === p }, p); }));
  const dl = h('datalist', { id: 'units-dl' });
  const fillUnits = function () { dl.replaceChildren.apply(dl, ((PROJECTS.find(function (p) { return p.name === project.value; }) || {}).units || []).map(function (u) { return h('option', { value: u }); })); };
  fillUnits(); project.addEventListener('change', fillUnits);
  const unit = h('input', { type: 'text', id: 'f-unit', value: x.unit || '', list: 'units-dl', placeholder: 'كود الوحدة' });
  const budget = h('input', { type: 'text', id: 'f-budget', value: x.budget || '', placeholder: 'مثلاً 3-4 مليون / كاش' });
  let owner = null;
  if (isMgr()) {
    const opts = [];
    if (isNew) opts.push(['auto', 'توزيع تلقائي']);
    PEOPLE.forEach(function (p) { opts.push([p.email, nm(p.email)]); });
    if (x.ownerEmail && !opts.some(function (o) { return o[0] === x.ownerEmail; })) opts.push([x.ownerEmail, nm(x.ownerEmail)]);
    opts.push(['', 'بدون مسؤول']);
    owner = h('select', { id: 'f-owner-sel' }, opts.map(function (o) { return h('option', { value: o[0] }, o[1]); }));
    owner.value = isNew ? 'auto' : (x.ownerEmail || '');
  }
  const fu = h('input', { type: 'date', id: 'f-fu', value: x.nextFollowUp || '' });
  const note = isNew ? h('textarea', { id: 'f-note', rows: 3, placeholder: 'أول تواصل، اهتماماته، أي تفاصيل' }) : null;
  const warn = h('div', {});
  const save = h('button', { class: 'btn primary' }, isNew ? 'إضافة الليد' : 'احفظ التعديلات');
  let force = false;
  save.addEventListener('click', async function () {
    const d = { id: isNew ? null : l.id, name: name.value.trim(), phone: phone.value.trim(), email: email.value.trim(), source: source.value,
      project: project.value, unit: unit.value.trim(), budget: budget.value.trim(), nextFollowUp: fu.value || '' };
    if (!d.name && !d.phone) { toast('اكتب الاسم أو الموبايل على الأقل', 'err'); return; }
    if (owner) d.ownerEmail = owner.value;
    if (isNew) { d.note = note.value.trim(); d.force = force; }
    save.disabled = true;
    try {
      const r = await api('api_saveLead', d);
      if (r.duplicate) {
        const dup = r.duplicate;
        warn.replaceChildren(h('div', { class: 'warnbox' },
          'الرقم ده متسجل قبل كده' + (dup.name ? ' باسم «' + dup.name + '»' : '') + ' مع ' + dup.ownerName + '.',
          dup.id ? h('button', { class: 'btn', onclick: function () { openLead(dup.id); } }, 'افتحه') : null,
          dup.canForce ? h('button', { class: 'btn', onclick: function () { force = true; save.click(); } }, 'ضيفه برضه') : null));
        save.disabled = false; return;
      }
      applyResult(r);
      toast(isNew ? 'الليد اتضاف' : 'اتحفظ');
      if (isNew) openLead(r.lead.id); else save.disabled = false;
    } catch (e) { toast(errText(e), 'err'); save.disabled = false; }
  });
  return h('div', {}, h('span', { class: 'lbl' }, isNew ? 'بيانات الليد' : 'البيانات'),
    h('div', { class: 'form' },
      field('الاسم', 'f-name', name), field('الموبايل', 'f-phone', phone), field('المصدر', 'f-src', source), field('الإيميل', 'f-email', email),
      field('المشروع', 'f-proj', project), field('الوحدة', 'f-unit', h('div', {}, unit, dl)), field('الميزانية', 'f-budget', budget),
      owner ? field('المسؤول', 'f-owner-sel', owner) : field('المسؤول', 'f-owner-ro', h('div', { id: 'f-owner-ro', style: 'padding:8px 0' }, isNew ? 'أنا' : nm(x.ownerEmail))),
      field('ميعاد المتابعة الجاية', 'f-fu', fu), note ? field('ملاحظة', 'f-note', note, true) : null,
      h('div', { class: 'full' }, warn), h('div', { class: 'full acts' }, save)));
}
function activityBox(l) {
  const A = C.actLabel;
  const type = h('select', { id: 'a-type' }, ['call', 'whatsapp', 'visit', 'meeting', 'note'].map(function (k) { return h('option', { value: k }, A[k]); }));
  const text = h('textarea', { id: 'a-text', rows: 2, placeholder: 'حصل إيه؟ قال إيه؟' });
  const next = h('input', { type: 'date', id: 'a-next' });
  const quick = function (n, t) { return h('button', { class: 'btn ghost', onclick: function () { next.value = addDays(TODAY, n); } }, t); };
  const btn = h('button', { class: 'btn primary' }, 'سجّل');
  btn.addEventListener('click', async function () {
    if (type.value === 'note' && !text.value.trim() && !next.value) { toast('اكتب حصل إيه أو حدد ميعاد متابعة', 'err'); return; }
    btn.disabled = true;
    try {
      const r = await api('api_addActivity', l.id, { type: type.value, text: text.value.trim(), nextFollowUp: next.value });
      text.value = ''; if (next.value) { const f = $('f-fu'); if (f) f.value = next.value; } next.value = '';
      applyResult(r); toast('اتسجل');
    } catch (e) { toast(errText(e), 'err'); }
    btn.disabled = false;
  });
  return h('div', { class: 'addact' }, h('span', { class: 'lbl', style: 'margin:0' }, 'سجّل تواصل'),
    h('div', { class: 'row' }, type), text,
    h('div', { class: 'row' }, h('label', { for: 'a-next', class: 'meta' }, 'المتابعة الجاية'), next, quick(1, 'بكرة'), quick(3, 'بعد 3 أيام'), quick(7, 'بعد أسبوع')),
    h('div', { class: 'acts' }, btn));
}
function dangerZone(l) {
  const box = h('div', { class: 'danger-zone' });
  const draw = function () {
    box.replaceChildren(h('button', { class: 'btn danger', onclick: function () {
      box.replaceChildren(h('span', {}, 'متأكد؟ المسح نهائي ومعاه سجل النشاط.'),
        h('button', { class: 'btn danger', onclick: async function () {
          try { await api('api_deleteLead', l.id); LEADS = LEADS.filter(function (x) { return x.id !== l.id; }); closeLead(); toast('اتمسح'); render(); }
          catch (e) { toast(errText(e), 'err'); }
        } }, 'امسح'),
        h('button', { class: 'btn ghost', onclick: draw }, 'لأ'));
    } }, 'امسح الليد'));
  };
  draw();
  return box;
}
async function changeStage(id, k, extra) {
  try { const r = await api('api_changeStage', id, k, extra || {}); applyResult(r); toast('اتنقل لـ «' + SL[k] + '»'); }
  catch (e) { toast(errText(e), 'err'); }
}

/* ---------- refresh ---------- */
let refreshing = false;
async function refresh(manual) {
  if (refreshing) return; refreshing = true;
  try { const r = await api('api_listLeads'); LEADS = r.leads; TODAY = r.today || TODAY; if (!settingsDirty) render(); if (manual) toast('اتحدّث'); }
  catch (e) { if (manual) toast(errText(e), 'err'); }
  refreshing = false;
}
setInterval(function () { if (document.visibilityState === 'visible' && ME) refresh(false); }, 60000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && ME) refresh(false); });

/* ---------- toolbar ---------- */
$('q').addEventListener('input', function (e) { F.q = e.target.value; render(); });
$('f-owner').addEventListener('change', function (e) { F.owner = e.target.value; render(); });
$('f-source').addEventListener('change', function (e) { F.source = e.target.value; render(); });
$('f-project').addEventListener('change', function (e) { F.project = e.target.value; render(); });
$('add-btn').addEventListener('click', function () { openLead('new'); });
$('refresh-btn').addEventListener('click', function () { refresh(true); });

/* ---------- boot ---------- */
api('api_bootstrap').then(function (b) {
  ME = b.me; PEOPLE = b.people; PROJECTS = b.projects; LEADS = b.leads; C = b.consts; ADMIN = b.admin || null;
  TODAY = C.today || localToday();
  SL = Object.fromEntries(C.stages); SRC = Object.fromEntries(C.sources);
  F.owner = isMgr() ? 'all' : 'me';
  render();
}).catch(function (e) {
  $('view').replaceChildren(h('div', { class: 'err-page' }, h('h2', {}, 'مش قادر تدخل'), h('p', {}, errText(e))));
});
