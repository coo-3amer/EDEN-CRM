<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EDEN CRM</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2B5C4B">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232B5C4B'/%3E%3Cpath d='M8 3c2.4 1.7 3.6 3.6 3.6 5.6A3.6 3.6 0 0 1 8 12.2a3.6 3.6 0 0 1-3.6-3.6C4.4 6.6 5.6 4.7 8 3Z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="signin" class="signin" hidden>
  <div class="signin-card">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5c3 2.2 4.5 4.6 4.5 7.2A4.5 4.5 0 0 1 8 13.2a4.5 4.5 0 0 1-4.5-4.5C3.5 6.1 5 3.7 8 1.5Z" fill="var(--accent-fg)"/><path d="M8 14.5V7" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/></svg></div>
    <h1>EDEN CRM</h1>
    <p id="signin-intro">Sign in with your EDEN work email.</p>
    <form id="code-form" class="code-form" novalidate>
      <div id="step-email" class="code-step">
        <label for="si-email">Work email</label>
        <input type="email" id="si-email" autocomplete="email" placeholder="name@edenalkhalij.com" required>
        <button type="submit" class="btn primary" id="si-send">Email me a sign-in code</button>
      </div>
      <div id="step-code" class="code-step" hidden>
        <label for="si-code">6-digit code sent to <b id="si-to"></b></label>
        <input type="text" id="si-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
        <button type="submit" class="btn primary" id="si-verify">Sign in</button>
        <button type="button" class="btn ghost" id="si-back">Use another email or resend</button>
      </div>
    </form>
    <div id="gsi-wrap" hidden><div class="or"><span>or</span></div><div id="gsi-btn"></div></div>
    <p id="signin-msg" class="status" role="status"></p>
  </div>
</div>
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand-row">
        <div class="mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5c3 2.2 4.5 4.6 4.5 7.2A4.5 4.5 0 0 1 8 13.2a4.5 4.5 0 0 1-4.5-4.5C3.5 6.1 5 3.7 8 1.5Z" fill="var(--accent-fg)"/><path d="M8 14.5V7" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/></svg></div>
        <div class="brand">EDEN CRM <small>Leads &amp; sales</small></div>
        <div class="spacer"></div>
        <button class="btn ghost icon" id="refresh-btn" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
        <div class="me" id="me"></div>
      </div>
      <nav class="tabs" role="tablist" id="tabs"></nav>
    </div>
  </header>
  <div class="bar" id="bar" hidden>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search name, phone, unit or tag" autocomplete="off" dir="auto">
    </div>
    <select id="f-owner" aria-label="Owner"></select>
    <select id="f-source" aria-label="Source"></select>
    <select id="f-project" aria-label="Project"></select>
    <select id="f-rating" aria-label="Rating"></select>
    <button class="btn primary" id="add-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>New lead</button>
  </div>
  <main id="view"><div class="skeleton">Loading EDEN CRM…</div></main>
</div>
<div id="drawer-root"></div>
<div id="toast-root"></div>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
